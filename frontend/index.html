<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SRM BFHL Challenge</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            padding: 25px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        .card h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.5em;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        textarea {
            width: 100%;
            height: 200px;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            resize: vertical;
            transition: border-color 0.3s ease;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-submit {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-submit:hover {
            transform: scale(1.02);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        .btn-clear {
            background: #f0f0f0;
            color: #333;
        }

        .btn-clear:hover {
            background: #e0e0e0;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #fee;
            color: #c00;
            padding: 15px;
            border-radius: 5px;
            margin-top: 15px;
            border-left: 4px solid #c00;
            display: none;
        }

        .results-container {
            display: none;
        }

        .result-section {
            margin-bottom: 20px;
        }

        .section-title {
            color: #667eea;
            font-size: 1.2em;
            font-weight: 600;
            margin-bottom: 10px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 8px;
        }

        .hierarchy-item {
            background: #f9f9f9;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 5px;
        }

        .hierarchy-root {
            font-weight: 600;
            color: #667eea;
            margin-bottom: 5px;
        }

        .tree-display {
            font-family: 'Courier New', monospace;
            background: #f0f0f0;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
            font-size: 12px;
            color: #333;
        }

        .cycle-badge {
            display: inline-block;
            background: #ff6b6b;
            color: white;
            padding: 3px 8px;
            border-radius: 3px;
            font-size: 0.85em;
            margin-left: 5px;
            font-weight: 600;
        }

        .depth-info {
            color: #666;
            font-size: 0.9em;
            margin-top: 5px;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 10px;
        }

        .summary-item {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            border-radius: 5px;
            text-align: center;
        }

        .summary-item-value {
            font-size: 1.8em;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .summary-item-label {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .invalid-entry {
            display: inline-block;
            background: #ffe0e0;
            color: #c00;
            padding: 5px 10px;
            border-radius: 3px;
            margin: 3px;
            font-size: 0.9em;
        }

        .duplicate-entry {
            display: inline-block;
            background: #fff3cd;
            color: #856404;
            padding: 5px 10px;
            border-radius: 3px;
            margin: 3px;
            font-size: 0.9em;
        }

        .responsive {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .empty-state {
            text-align: center;
            padding: 20px;
            color: #999;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }

            .summary-grid {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 1.8em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌳 BFHL Hierarchy Analyzer</h1>
            <p>SRM Full Stack Engineering Challenge - Round 1</p>
        </div>

        <div class="main-content">
            <div class="card">
                <h2>📝 Input</h2>
                <div class="form-group">
                    <label for="input">Enter node relationships (one per line, format: A->B):</label>
                    <textarea id="input" placeholder="A->B&#10;A->C&#10;B->D"></textarea>
                </div>

                <div class="button-group">
                    <button class="btn-submit" onclick="submitData()">Analyze</button>
                    <button class="btn-clear" onclick="clearInput()">Clear</button>
                </div>

                <div class="loading" id="loading">
                    <div class="spinner"></div>
                    <p style="margin-top: 10px; color: #667eea;">Processing...</p>
                </div>

                <div class="error" id="error"></div>
            </div>

            <div class="card results-container" id="resultsContainer">
                <h2>📊 Results</h2>
                <div id="results"></div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000'; // Update this for production

        async function submitData() {
            const input = document.getElementById('input').value.trim();
            if (!input) {
                showError('Please enter at least one node relationship');
                return;
            }

            const data = input.split('\n').map(line => line.trim()).filter(line => line);

            showLoading(true);
            document.getElementById('error').style.display = 'none';

            try {
                const response = await fetch(`${API_URL}/bfhl`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ data })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const result = await response.json();
                displayResults(result);
            } catch (error) {
                showError(`Failed to call API: ${error.message}. Make sure the API is running at ${API_URL}`);
                console.error('Error:', error);
            } finally {
                showLoading(false);
            }
        }

        function displayResults(data) {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '';

            // User Info
            const userInfoHTML = `
                <div class="result-section">
                    <div class="section-title">👤 User Info</div>
                    <div style="padding: 10px; background: #f9f9f9; border-radius: 5px;">
                        <p><strong>User ID:</strong> ${data.user_id}</p>
                        <p><strong>Email:</strong> ${data.email_id}</p>
                        <p><strong>Roll Number:</strong> ${data.college_roll_number}</p>
                    </div>
                </div>
            `;

            // Hierarchies
            let hierarchiesHTML = '<div class="result-section"><div class="section-title">🌲 Hierarchies</div>';
            if (data.hierarchies.length === 0) {
                hierarchiesHTML += '<div class="empty-state">No valid hierarchies found</div>';
            } else {
                data.hierarchies.forEach(h => {
                    const treeStr = JSON.stringify(h.tree, null, 2);
                    hierarchiesHTML += `
                        <div class="hierarchy-item">
                            <div class="hierarchy-root">
                                Root: ${h.root}
                                ${h.has_cycle ? '<span class="cycle-badge">CYCLE</span>' : ''}
                            </div>
                            <div class="tree-display">${escapeHtml(treeStr)}</div>
                            ${h.depth ? `<div class="depth-info">Depth: ${h.depth}</div>` : ''}
                        </div>
                    `;
                });
            }
            hierarchiesHTML += '</div>';

            // Invalid Entries
            let invalidHTML = '<div class="result-section"><div class="section-title">⚠️ Invalid Entries</div>';
            if (data.invalid_entries.length === 0) {
                invalidHTML += '<div class="empty-state">No invalid entries</div>';
            } else {
                invalidHTML += '<div class="responsive">';
                data.invalid_entries.forEach(entry => {
                    invalidHTML += `<span class="invalid-entry">${escapeHtml(entry)}</span>`;
                });
                invalidHTML += '</div>';
            }
            invalidHTML += '</div>';

            // Duplicate Edges
            let duplicateHTML = '<div class="result-section"><div class="section-title">🔄 Duplicate Edges</div>';
            if (data.duplicate_edges.length === 0) {
                duplicateHTML += '<div class="empty-state">No duplicate edges</div>';
            } else {
                duplicateHTML += '<div class="responsive">';
                data.duplicate_edges.forEach(entry => {
                    duplicateHTML += `<span class="duplicate-entry">${escapeHtml(entry)}</span>`;
                });
                duplicateHTML += '</div>';
            }
            duplicateHTML += '</div>';

            // Summary
            const summaryHTML = `
                <div class="result-section">
                    <div class="section-title">📈 Summary</div>
                    <div class="summary-grid">
                        <div class="summary-item">
                            <div class="summary-item-value">${data.summary.total_trees}</div>
                            <div class="summary-item-label">Total Trees</div>
                        </div>
                        <div class="summary-item">
                            <div class="summary-item-value">${data.summary.total_cycles}</div>
                            <div class="summary-item-label">Total Cycles</div>
                        </div>
                        <div class="summary-item">
                            <div class="summary-item-value">${data.summary.largest_tree_root || '-'}</div>
                            <div class="summary-item-label">Largest Tree Root</div>
                        </div>
                    </div>
                </div>
            `;

            resultsDiv.innerHTML = userInfoHTML + hierarchiesHTML + invalidHTML + duplicateHTML + summaryHTML;
            document.getElementById('resultsContainer').style.display = 'block';
        }

        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
        }

        function showError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }

        function clearInput() {
            document.getElementById('input').value = '';
            document.getElementById('resultsContainer').style.display = 'none';
            document.getElementById('error').style.display = 'none';
            document.getElementById('input').focus();
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        // Focus on input when page loads
        window.addEventListener('load', () => {
            document.getElementById('input').focus();
        });
    </script>
</body>
</html>
